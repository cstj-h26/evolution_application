<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: linear-gradient(70deg,rgba(0, 61, 91, 1) 0%, rgba(0, 121, 140, 1) 100%);
            color: #FFF;
            width: 100%;
            height: 100%;
        }

        h1 {
            font-weight: bold;
            font-family: sans-serif;
            font-size: 30px;

            user-select: none;
            text-align: center;
        }

        button {
            background-color: #EDAE49;
            color: #FFF;
            
            font-weight: bold;
            font-family: sans-serif;
            
            outline: none;
            border: none;

            cursor: pointer;
            padding: 5px;
            margin: 5px;

            box-shadow: 0px 5px 0px #D1495B;
            transition: .3s;
        }

        button:hover {
            box-shadow: 0px 0px 0px #D1495B;
            transform: translateY(5px);
        }

        #buttonParent {
            width: 100%;

            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1>TaskBox</h1>
    <h1>Ubert Guertin</h1>
    <h1>Hiver 2026</h1>

    <div id="buttonParent">
        <button>Fermer</button>
    </div>
</body>
</html>
